[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubbertech"
version = "2.0.0"
description = "Programação da produção de correias por Programação Linear Inteira Mista (EP58D)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pulp", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rubbertech*"]

[tool.pytest.ini_options]
testpaths = ["testes.py"]
# O PuLP 3.x avisa sobre APIs que mudarão no PuLP 4. O projeto usa de propósito
# a API estável atual, que funciona nas duas versões; os avisos só poluiriam a
# saída dos testes.
filterwarnings = [
    "ignore::DeprecationWarning:pulp",
    "ignore::DeprecationWarning:pulp.pulp",
    "ignore::DeprecationWarning:pulp.apis.coin_api",
]
